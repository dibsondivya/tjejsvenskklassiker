<style>
/* Layout: one column tool, day-first. Tabs: Today / Week / Plan / Progress. Fjord-blue accent, lingonberry for race days. */
/* Palette: Monet's water lilies. Mist blue ground, lily-pad greens, periwinkle water, pink lily accents, sunlit gold. */
:root{
  --bg:#edf3fb; --surface:#ffffff; --surface2:#e1ebf8; --ink:#1c2848; --muted:#566684; --line:#c9d8ee;
  --accent:#4660c8; --accent-ink:#ffffff; --race:#c93a74; --good:#2f8f5f; --warn:#c98a1d;
  --k-ski:#4660c8; --k-bike:#d3912a; --k-swim:#1b9aa3; --k-run:#d9588f; --k-str:#8456c4; --k-vb:#7684a8; --k-rest:#93a6c6; --k-todo:#1c2848; --k-race:#c93a74;
  --glow1:#f6d7e8; --glow2:#cfe8e3;
  --font-head:"Space Grotesk",system-ui,sans-serif; --font-body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1830; --surface:#16243f; --surface2:#1e3052; --ink:#e8eefc; --muted:#9db0d4; --line:#2c4068;
  --accent:#8ea6ff; --accent-ink:#0b1430; --race:#ff7fb0; --good:#52c28a; --warn:#f0bd54;
  --k-ski:#8ea6ff; --k-bike:#f0bd54; --k-swim:#4fd0d0; --k-run:#ff86b4; --k-str:#b697f2; --k-vb:#9db0d4; --k-rest:#6f86ad; --k-todo:#e8eefc; --k-race:#ff7fb0;
  --glow1:#3a1e44; --glow2:#12404a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1830; --surface:#16243f; --surface2:#1e3052; --ink:#e8eefc; --muted:#9db0d4; --line:#2c4068;
  --accent:#8ea6ff; --accent-ink:#0b1430; --race:#ff7fb0; --good:#52c28a; --warn:#f0bd54;
  --k-ski:#8ea6ff; --k-bike:#f0bd54; --k-swim:#4fd0d0; --k-run:#ff86b4; --k-str:#b697f2; --k-vb:#9db0d4; --k-rest:#6f86ad; --k-todo:#e8eefc; --k-race:#ff7fb0;
  --glow1:#3a1e44; --glow2:#12404a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(900px 420px at 100% 0,var(--glow1),transparent 70%),radial-gradient(800px 460px at 0 12%,var(--glow2),transparent 70%);background-repeat:no-repeat;color:var(--ink);font:15px/1.5 var(--font-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.45rem} h2{font-size:1.2rem} h3{font-size:1rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync.warn i{background:var(--warn)}
.races{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.race{flex:1 0 150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;min-width:0}
.race b{font:600 1.3rem var(--font-head);display:block;font-variant-numeric:tabular-nums}
.race span{font-size:.75rem;color:var(--muted);display:block}
.race.next{border-color:var(--race)}
#view{display:flex;flex-direction:column;gap:14px}
.subs{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.sub{display:flex;gap:10px;align-items:flex-start}
.sub.done .sn{text-decoration:line-through;color:var(--muted)}
.chk.sm{width:24px;height:24px;border-radius:7px}.chk.sm svg{width:14px;height:14px}
.sx{min-width:0;font-size:.88rem;overflow-wrap:anywhere}
.sn{font-weight:500}.sr{color:var(--muted);font-size:.8rem;white-space:nowrap}
.how{font-size:.78rem;font-weight:600;color:var(--accent);white-space:nowrap}
.ctl{display:flex;gap:6px;margin-top:4px}
.mv{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:32px;padding:0 8px;font-size:.8rem}
.mv:disabled{opacity:.35}.mv.wide{padding:0 12px}
.swin{padding:5px 8px}
.lg{margin-top:4px}
.lgh{font-size:.78rem;color:var(--muted);margin:4px 0}
.lgrid{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:6px 8px;align-items:center;max-width:340px}
.lgrid input{padding:6px 8px}.sl{font-size:.8rem;color:var(--muted)}
select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:9px;font-weight:600;font-size:.9rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px}
.dayhead{display:flex;flex-direction:column;gap:2px}
.dayhead .date{font:600 1.25rem var(--font-head)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:.72rem;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.race{background:var(--race);color:var(--accent-ink);border:0;flex:none;min-width:0;padding:2px 9px}
.chip.adj{background:var(--warn);color:var(--accent-ink)}
.items{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;border-left:5px solid var(--kc,var(--k-rest));min-width:0}
.item.done{background:var(--surface2)} .item.done .t{text-decoration:line-through;color:var(--muted)}
.item.skipped{opacity:.65} .item.skipped .t{font-style:italic}
.row{display:flex;gap:10px;align-items:flex-start}
.chk{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:var(--surface);display:grid;place-items:center;padding:0}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.chk svg{width:16px;height:16px;opacity:0}.chk[aria-pressed="true"] svg{opacity:1}
.t{font-weight:600;min-width:0;overflow-wrap:anywhere;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:.72rem;color:var(--muted)}
.tag{font-weight:600}
.tag.key{color:var(--accent)} .tag.kind{color:var(--kc)}
.sk{border:0;background:transparent;color:var(--muted);font-size:.78rem;text-decoration:underline;padding:4px}
details summary{cursor:pointer;color:var(--accent);font-size:.82rem;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details p{margin:6px 0 0;font-size:.88rem;color:var(--ink);overflow-wrap:anywhere}
.nut{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:.82rem}
.nut div{background:var(--surface2);border-radius:8px;padding:6px 8px;min-width:0}
.nut b{display:block;font:600 .95rem var(--font-head);font-variant-numeric:tabular-nums}
.feel{display:flex;gap:6px;flex-wrap:wrap}
.feel button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;min-width:44px}
.feel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
textarea,input[type=text],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px}
textarea{min-height:72px;resize:vertical}
label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.banner{background:var(--surface2);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:.9rem}
.banner b{font-family:var(--font-head)}
.banner.coach{background:var(--cn);border-color:var(--cn);color:#111a33;font-weight:500}
.banner.coach .note-sm{color:#111a33;opacity:.75}
.week{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;width:100%}
.wrow.today{border-color:var(--accent)} .wrow .d{font:600 .95rem var(--font-head)} .wrow .d small{display:block;color:var(--muted);font:400 .72rem var(--font-body)}
.wrow .s{min-width:0;font-size:.85rem;overflow-wrap:anywhere}
.pct{font:600 .85rem var(--font-head);font-variant-numeric:tabular-nums}
.wk-nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wk-nav button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:.7rem;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:7px;font-size:.78rem;padding:0;position:relative;font-variant-numeric:tabular-nums;min-width:0}
.cal button.pad{visibility:hidden}
.cal button.full{background:var(--good);color:var(--accent-ink);border-color:var(--good)}
.cal button.part{background:color-mix(in srgb,var(--good) 35%,var(--surface))}
.cal button.miss{background:color-mix(in srgb,var(--warn) 30%,var(--surface))}
.cal button.today{outline:2px solid var(--accent)}
.cal button.rc{border:2px solid var(--race);color:var(--race);font-weight:700}
.cal button.full.rc{color:var(--accent-ink)}
.cal button.rc::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--race)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:600 1.3rem var(--font-head);font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:9px;padding:9px 14px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.empty{color:var(--muted);font-size:.88rem}
svg text{fill:var(--muted);font:11px var(--font-body)}
.note-sm{font-size:.8rem;color:var(--muted)}
.jump{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px}
@media (max-width:420px){.wrow{grid-template-columns:54px 1fr auto}.nut{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app">
  <div class="top">
    <div><h1>Klassiker Training Log</h1><div class="note-sm" id="sub"></div></div>
    <div class="sync" id="sync"><i></i><span>Loading</span></div>
  </div>
  <div class="races" id="races"></div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-v="today" aria-selected="true">Today</button>
    <button role="tab" data-v="week" aria-selected="false">Week</button>
    <button role="tab" data-v="plan" aria-selected="false">Plan</button>

  </div>
  <div id="view"></div>
</div>

<script>
const PLAN = {"start":"2026-11-23","end":"2027-09-26","det":["Fixed part of the week. Dinner about 17:30–18:00, banana or toast about 19:45, protein snack after (200 g kvarg/skyr + berries). In bed by about 23:30. If the club is not playing, swap for 30 min easy bike or a brisk walk.","Do this first thing, before the session.","Write it in the day note so the plan can check the fit. Poles around 143 cm are ideal for 172 cm.","Optional, light. Do it earlier in the day, not on top of volleyball.","Test before taking iron or high-dose vitamin D.","Choose a weight where the last 1–2 reps are hard but clean (RPE 7–8). Add weight once you hit the top of the range on every set. Log the weights in the day note.","Engelbrektsloppet 30 (13 Feb), Tjejvättern (12 Jun), Vansbro Tjejsim (9 Jul), Rosa Bandet-loppet (26 Sep: confirm date). Consider Startklar insurance for Motala and Vansbro.","Full rest. Sleep 7.5–8 h, eat at maintenance, a gentle walk if you like.","Budget about 500–800 kr. Only buy what you actually lack.","Gym indoor bike. If the pedals take SPD cleats, wear your clip-in shoes and practise clipping in/out (unclip early, lean toward the unclipping foot). Steady conversational effort; a few standing efforts and gear changes to mimic hills. Bring water and a banana for anything over 75 min. Then SkiErg double-pole: stand tall, reach, hinge from hips, pull through with core and lats, arms finish by the thighs. Start light drag (damper 3–4), rhythm over power. Warm up 5 min, then 6–8 × 2 min on / 1 min off, easy 5 min cool-down.","Drills: catch-up, fingertip drag, side-kick. Then 6 × 100 m easy with rest. Skip it if you are tired. Book a technique lesson if you have not yet.","Norberg is usually snow-safe from about 1 Dec. Plan day trips on Saturdays.","Rotate the benchmark: push-ups / plank / 400 m swim / 5 km run. Enter values in Progress.","Check the Norberg track status and the train/bus times first. Classic technique: kick-glide, relaxed knees, poles planted level with the boot. A 30–60 min lesson on one of the ski days is worth it. Bring 30–60 g carbs per hour (banana, dates, chews), a warm drink, spare gloves and a buff. Wear your layers: Urberg merino base, Haglöfs fleece, Columbia windbreaker, thin Urberg socks. No snow or no trip? Gym bike 70 min + 20 min SkiErg.","Discuss with the clinic.","Choose a weight where the last 1–2 reps are hard but clean (RPE 7–8). Add weight once you hit the top of the range on every set. Log the weights in the day note. LIGHTER WEEK: do 2 sets per exercise.","Keep the habit, no pressure. Enjoy the food.","Classic technique: kick-glide, relaxed knees, poles planted level with the boot. A 30–60 min lesson on one of the ski days is worth it. Bring 30–60 g carbs per hour (banana, dates, chews), a warm drink, spare gloves and a buff. Wear your layers: Urberg merino base, Haglöfs fleece, Columbia windbreaker, thin Urberg socks. No snow reachable? 90 min gym bike + 25 min SkiErg intervals counts as the fallback, and tell me so I can adapt the plan.","27 Sep 2027 is a Monday, so the 26th is likely.","Tell me and I will adjust the plan.","Race tomorrow or close: rest, feet up, early night.","Very easy, 4 × 20 s strides at the end.","Loosen the legs. Do not add anything new.","Pack: skis, boots, poles, layers, fuel, bib. Confirm the bus/train time to Norberg. Early night.","Engelbrektsloppet 30, Norberg. Plan 4–5 h as a beginner: start slow, fuel from the first hour. Bring 30–60 g carbs per hour (banana, dates, chews), a warm drink, spare gloves and a buff. Wear your layers: Urberg merino base, Haglöfs fleece, Columbia windbreaker, thin Urberg socks.","Loosen the shoulders. Easy laps only.","Walk, eat well, write down what worked and what to change.","Write it in the day note.","Recovery.","No hard lifting this week.","Full rest.","Gym indoor bike. If the pedals take SPD cleats, wear your clip-in shoes and practise clipping in/out (unclip early, lean toward the unclipping foot). Steady conversational effort; a few standing efforts and gear changes to mimic hills. Bring water and a banana for anything over 75 min.","Drills: catch-up, fingertip drag, side-kick. Then 6 × 100 m easy with rest.","Where: gym bike. If gym bike, split into 2 × 45 min if needed. Wear padded gloves, pack tube + pump, eat 30–60 g carbs per hour.","Steady laps with strong-pull sets (6 × 100 m at slightly firmer effort). Technique first. Aim for at least one swim every week or two.","Clip in and out 10 times each side on the gym bike (if SPD) and ride 20 min easy. Keep the effort easy: this is a skills session the day after your long ride.","Book early; Tjejvättern weekend fills up.","Braking: practise two-finger firm braking and releasing before turns on a quiet car park or path. Keep the effort easy: this is a skills session the day after your long ride.","Cornering: hands on the drops, outside pedal down, inside knee out, look through the turn. Keep the effort easy: this is a skills session the day after your long ride.","Where: outdoors if roads are dry, else gym bike. If gym bike, split into 2 × 45 min if needed. Wear padded gloves, pack tube + pump, eat 30–60 g carbs per hour.","Descending: weight back, light on the hands, brake before not during the corner, aim for control not speed. Keep the effort easy: this is a skills session the day after your long ride.","Riding close to another rider: ride with a friend or club, hold a line, no sudden braking. Keep the effort easy: this is a skills session the day after your long ride.","Eat and drink on the bike: practise one-handed bottle and snack handling. Keep the effort easy: this is a skills session the day after your long ride.","Outdoors. Include some climbing: a train trip with the bike to a hillier area works, or repeat a bridge. Check cykel på tåg rules. Wear padded gloves, pack tube + pump, eat 30–60 g carbs per hour.","Hills: 4–6 × 2–3 min climbing in an easy gear, seated, then easy spin. Use a bridge or rise. Keep the effort easy: this is a skills session the day after your long ride.","Standing climbs and gear changes: shift early, keep a smooth cadence. Keep the effort easy: this is a skills session the day after your long ride.","Fast starts and clipping in at junctions without panic. Keep the effort easy: this is a skills session the day after your long ride.","Choose a weight where the last 1–2 reps are hard but clean (RPE 7–8). Add weight once you hit the top of the range on every set. Log the weights in the day note. MAINTENANCE: 2 sets per exercise, about 30–40 min.","Group-ride practice: join a club ride if you can; keep your line and signal. Keep the effort easy: this is a skills session the day after your long ride.","Descending with confidence: pick a gentle hill and repeat it 4–5 times, a little faster each time. Keep the effort easy: this is a skills session the day after your long ride.","Race simulation: 60 min steady at endurance pace, eating every 30 min. Keep the effort easy: this is a skills session the day after your long ride.","Practise your race food, kit and pacing. Ride steady, not fast. Stop to refill water. Wear padded gloves, pack tube + pump, eat 30–60 g carbs per hour.","Hill repeats 5 × 3 min seated plus one standing, easy spin between. Keep the effort easy: this is a skills session the day after your long ride.","Wetsuit, neoprene cap, tow float, never alone, official bathing site only. Check algae warnings first. Water about 12–15 °C: get out if you cannot control your breathing.","Easy spin, check bike, a few relaxed efforts. Wear padded gloves, pack tube + pump, eat 30–60 g carbs per hour.","Cornering circuit: figure-eight in a quiet car park, both directions, 10 min. Keep the effort easy: this is a skills session the day after your long ride.","Check gears, brakes and tyres. Easy legs.","Legs fresh for Saturday. Check the weather and the pack list.","Travel to Motala, check in, collect start pack, check tyres and brakes, eat carbs, in bed by 22:00.","Nothing new on race day. Practise what you ate on the 29 May ride.","Tjejvättern, Motala, 07:30–09:00 start. Eat before and every 30–40 min on the bike, brake early for corners, unclip early at stops. Omberg hills: gear down, stay seated, sit back on descents.","Eat well, hydrate.","Enter measurements in Progress.","Official bathing site, tow float, never alone. Practise sighting every 6–8 strokes, straight lines and a crowded start. Check algae and water-quality warnings.","Warm up 200 m, 6 × 100 m firm pull effort (upstream prep), 4 × 50 m sighting, cool down.","2 sets of squat/RDL, row, press, plank. No heavy loads this close to the swim.","Wetsuit, neoprene cap, tow float, a friend on the shore. Strong steady pulling to mimic the upstream swim in Vansbro.","Keep it easy.","Wetsuit, tow float, practise a calm start in a group.","Rest, pack wetsuit/cap/goggles, check the train times for Friday morning, eat well, early night.","Vansbro Tjejsim is swum upstream: steady strong pulling, sight every 6–8 strokes, start wide and calm. Wetsuit, neoprene cap, goggles. Afternoon start, check the official time.","Eat well, sleep, walk only.","Easy conversational pace on trails with hills. Walk the steepest parts. Carry water above 8 km, practise gels at 10 km+.","Very easy. Find a hill or bridge for 4–6 short hill strides. Swap for an easy swim or bike if you prefer.","Short strides only. Keep it easy.","Legs fresh for Sunday.","15–20 min easy shakeout, lay out kit, carb-rich dinner, early night.","Rosa Bandet-loppet 10 km on forest trails. Start easy for 2 km, hills by effort not pace, Cancerfonden pink kit. Date assumed Sun 26 Sep: confirm."],"subs":[[["Cat-cow","10 slow reps","cat cow stretch how to"],["90/90 hip switches","8 per side","90 90 hip switch mobility"],["Open-book thoracic rotation","8 per side","open book thoracic rotation stretch"],["World's greatest stretch","4 per side","worlds greatest stretch how to"],["Band pull-aparts or shoulder circles","10 reps","b     ${wb.map((w,i)=>`<rect x="${28+i*(bw+2)}" y="${90-w.pct*76}" width="${bw}" height="${Math.max(w.pct*76,1)}" rx="2" fill="${w.pct>=.8?"var(--good)":w.pct>=.5?"var(--warn)":"var(--race)"}"><title>Week of ${w.ws}: ${Math.round(w.pct*100)}%</title></rect>`).join("")}</svg>`:'<div class="empty">Bars appear after the first week starts.</div>';
  const mEntries=Object.entries(S.metrics).sort((a,b)=>b[0].localeCompare(a[0]));
  const mv=S.metrics[cur]||{};
  return `<div class="card"><h2>Progress</h2><div class="stats">
    <div class="stat"><b>${total?Math.round(done/total*100):0}%</b><span>core sessions done so far</span></div>
    <div class="stat"><b>${done}</b><span>sessions done</span></div><div class="stat"><b>${skip}</b><span>skipped</span></div><div class="stat"><b>${todoDone}/${todoTot}</b><span>to-dos ticked</span></div></div>
    <div class="meta">${Object.entries(byK).map(([k,v])=>`<span class="chip">${KN[k]||k}: ${v}</span>`).join("")}</div></div>
   <div class="card"><h3>Weekly completion</h3>${bars}<div class="legend"><span>Green: 80%+</span><span>Amber: 50–79%</span><span>Red: under 50%</span></div></div>
   <div class="card"><h3>Log measurements for ${fmt(cur,{weekday:"short",day:"numeric",month:"short"})}</h3>
    <div class="form">${MF.map(([k,l,t])=>`<label for="m-${k}">${l}<input id="m-${k}" data-m="${k}" type="${t}" ${t==="number"?'step="any" inputmode="decimal"':""} value="${esc(mv[k]??"")}"></label>`).join("")}</div>
    <button class="primary" data-act="savem" style="align-self:flex-start">Save measurements</button>
    <div class="note-sm">Use the Plan or Week tab to pick another date first. Waist and photos matter more than the scale.</div></div>
   <div class="card">${chart("waist","Waist","cm")}${chart("weight","Weight","kg")}</div>
   ${liftCard()}
   <div class="card"><h3>All entries</h3>${mEntries.length?`<div class="tblwrap"><table><thead><tr><th>Date</th><th>kg</th><th>Waist</th><th>Push-ups</th><th>Plank s</th><th>400 m</th><th>5 km</th></tr></thead><tbody>
    ${mEntries.map(([d,v])=>`<tr><td>${d}</td><td>${esc(v.weight??"")}</td><td>${esc(v.waist??"")}</td><td>${esc(v.pushups??"")}</td><td>${esc(v.plank??"")}</td><td>${esc(v.swim400??"")}</td><td>${esc(v.run5k??"")}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">No measurements yet. Your baseline is the first to-do on Monday 23 November.</div>'}</div>
   ${ghCard()}
   <div class="card"><h3>Backup and move between devices</h3>
    <div class="note-sm">${mode==="local"?"This copy stores your log on this device only. Copy a backup to move it to another device, or paste it into the chat so the plan can be adjusted.":"Your log is saved online. A backup is optional."}</div>
    <button class="primary" data-act="bk-copy" style="align-self:flex-start">Copy backup</button>
    <label for="bk">Paste a backup here to restore it</label><textarea id="bk" placeholder="Paste backup text"></textarea>
    <button class="jump" data-act="bk-restore" style="align-self:flex-start">Restore from pasted backup</button>
    <div class="note-sm" id="bkmsg" role="status">${esc(bkMsg)}</div></div>`;
}
function render(){
  if(document.activeElement&&/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)&&arguments[0]==="soft")return;
  const el=$("#view");
  el.innerHTML=view==="today"?viewDay():view==="week"?viewWeek():view==="plan"?viewPlan():viewProgress();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===view));
  renderRaces();
}
function renderRaces(){
  const next=PLAN.races.find(r=>r.d>=todayIso);
  $("#races").innerHTML=PLAN.races.map(r=>{
    const n=Math.round((parse(r.d)-parse(todayIso))/864e5);
    return `<button class="race ${next&&next.d===r.d?"next":""}" data-act="open" data-d="${r.d}"><b>${n>=0?n:"Done"}${n>=0?" d":""}</b><span>${esc(r.n)}</span><span>${fmt(r.d,{day:"numeric",month:"short",year:"numeric"})}</span></button>`;
  }).join("");
  $("#sub").textContent="23 Nov 2026 to 26 Sep 2027 · En Svensk Klassiker Tjej";
}

function backupText(){return JSON.stringify({v:1,saved:new Date().toISOString(),days:S.days,metrics:S.metrics})}
async function copyBackup(){
  const txt=backupText();
  try{await navigator.clipboard.writeText(txt);bkMsg="Backup copied. Paste it somewhere safe, or into the chat."}
  catch(e){const ta=$("#bk");if(ta){ta.value=txt;ta.focus();ta.select();bkMsg="Select and copy the text in the box."}}
  const m=$("#bkmsg");if(m)m.textContent=bkMsg;
}
function restoreBackup(){
  const ta=$("#bk");let data;
  try{data=JSON.parse(ta.value)}catch(e){bkMsg="That does not look like a backup.";$("#bkmsg").textContent=bkMsg;return}
  if(!data||typeof data!=="object"||!data.days){bkMsg="That does not look like a backup.";$("#bkmsg").textContent=bkMsg;return}
  let n=0;
  Object.entries(data.days).forEach(([d,v])=>{if(!BY[d]||!v||typeof v!=="object")return;const have=S.days[d];
    if(!have||!have.at||String(v.at||"")>String(have.at)){S.days[d]=Object.assign({t:{},note:"",feel:0},v);write("days",d,S.days[d]);n++}});
  Object.entries(data.metrics||{}).forEach(([d,v])=>{if(!v||typeof v!=="object")return;if(!S.metrics[d]||String(v.at||"")>String(S.metrics[d].at||"")){S.metrics[d]=v;write("metrics",d,v);n++}});
  bkMsg="Restored "+n+" day"+(n===1?"":"s")+" and entries that were newer than this device's copy.";render();
}
/* ---------- GitHub sync (copy hosted outside claude.ai) ---------- */
function ghCfg(){const c=localGet("gh");GH.cfg=c&&c.repo&&c.token?c:null}
const ghUrl=()=>"https://api.github.com/repos/"+GH.cfg.repo+"/contents/"+(GH.cfg.path||"progress.json");
const ghHdr=()=>({"Authorization":"Bearer "+GH.cfg.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
function b64dec(c){const bin=atob(String(c).replace(/\s/g,""));return new TextDecoder().decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0)))}
function b64enc(s){const b=new TextEncoder().encode(s);let o="";for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)}
function setGh(s){GH.status=s;setSync();const el=$("#ghstat");if(el)el.textContent=s}
async function ghErr(r){let m="";try{m=(await r.json()).message||""}catch(e){}
  if(r.status===401)return "token rejected: check it and its expiry";if(r.status===403)return "token lacks Contents read and write access";
  if(r.status===404)return "repo not found: check the name and the token's repository access";return "GitHub said "+r.status+" "+m}
function mergeRemote(rem){
  let local=false,remote=false;const rd=rem.days||{},rm=rem.metrics||{};
  const A=x=>String((x&&x.at)||"");
  Object.entries(rd).forEach(([d,v])=>{if(!BY[d]||!v)return;const h=S.days[d];
    if(!h||A(v)>A(h)){S.days[d]=Object.assign({t:{},note:"",feel:0},v);localSet("days/"+d,S.days[d]);local=true}else if(A(h)>A(v))remote=true});
  Object.keys(S.days).forEach(d=>{if(!rd[d])remote=true});
  Object.entries(rm).forEach(([d,v])=>{if(!v)return;const h=S.metrics[d];
    if(!h||A(v)>A(h)){S.metrics[d]=v;localSet("metrics/"+d,v);local=true}else if(A(h)>A(v))remote=true});
  Object.keys(S.metrics).forEach(d=>{if(!rm[d])remote=true});
  return{local,remote};
}
function scheduleSync(){if(!GH.cfg)return;clearTimeout(GH.timer);GH.timer=setTimeout(ghSync,2500)}
async function ghSync(){
  if(!GH.cfg)return; if(GH.busy){GH.again=true;return}
  GH.busy=true;setGh("Syncing");
  try{
    for(let attempt=0;attempt<3;attempt++){
      const r=await fetch(ghUrl(),{headers:ghHdr(),cache:"no-store"});
      let rem={},sha=null;
      if(r.status===404){const rr=await fetch("https://api.github.com/repos/"+GH.cfg.repo,{headers:ghHdr(),cache:"no-store"});if(!rr.ok)throw new Error(await ghErr(r))}
      else if(!r.ok)throw new Error(await ghErr(r));
      else{const j=await r.json();sha=j.sha;try{rem=JSON.parse(b64dec(j.content))}catch(e){rem={}}}
      const m=mergeRemote(rem); if(m.local)render("soft");
      if(m.remote||sha===null){
        const body={message:"Update training log",content:b64enc(backupText())};if(sha)body.sha=sha;
        const w=await fetch(ghUrl(),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},ghHdr()),body:JSON.stringify(body)});
        if(w.status===409||w.status===422)continue;
        if(!w.ok)throw new Error(await ghErr(w));
      }
      setGh("Synced "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));break;
    }
  }catch(e){setGh("Sync problem: "+(e&&e.message||"offline"))}
  finally{GH.busy=false;if(GH.again){GH.again=false;scheduleSync()}}
}
function ghConnect(){
  const repo=($("#gh-repo").value||"").trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,""),token=($("#gh-token").value||"").trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token){setGh("Sync problem: enter the repo as owner/name and paste the token");return}
  try{localStorage.setItem("klass-gh",JSON.stringify({repo,token,path:"progress.json"}))}catch(e){setGh("Sync problem: this browser blocks saving the token");return}
  ghCfg();render();ghSync();
}
function ghDisconnect(){try{localStorage.removeItem("klass-gh")}catch(e){}GH.cfg=null;setSync();render()}
function downloadProgress(){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([backupText()],{type:"application/json"}));a.download="progress.json";document.body.appendChild(a);a.click();a.remove();
}
function ghCard(){
  if(db)return "";
  if(GH.cfg)return `<div class="card"><h3>Sync across devices</h3>
    <div class="note-sm">Connected to <b>${esc(GH.cfg.repo)}</b>. Changes upload a few seconds after you make them, and load when you open the app.</div>
    <div class="note-sm" id="ghstat" role="status">${esc(GH.status)}</div>
    <div class="meta"><button class="primary" data-act="gh-sync">Sync now</button><button class="jump" data-act="gh-dl">Download progress file</button><button class="jump" data-act="gh-off">Disconnect</button></div></div>`;
  return `<div class="card"><h3>Sync across devices</h3>
    <div class="note-sm">Store your log in a private GitHub repo so your phone and laptop share it. Setup is in the README. Enter it once on each device.</div>
    <label for="gh-repo">Private data repo (owner/name)<input id="gh-repo" type="text" placeholder="dibsondivya/tjejsvenskklassiker-data" autocomplete="off" autocapitalize="off"></label>
    <label for="gh-token">Access token<input id="gh-token" type="password" placeholder="github_pat_..." autocomplete="off"></label>
    <button class="primary" data-act="gh-connect" style="align-self:flex-start">Connect and sync</button>
    <div class="note-sm" id="ghstat" role="status">${esc(GH.status)}</div>
    <button class="jump" data-act="gh-dl" style="align-self:flex-start">Download progress file</button></div>`;
}
/* ---------- events ---------- */
let noteTimer=null;
let bkMsg="";
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return; const a=b.dataset.act;
  if(a==="tick")toggle(cur,b.dataset.id,"d");
  else if(a==="skip")toggle(cur,b.dataset.id,"s");
  else if(a==="sub")toggleSub(cur,b.dataset.id,+b.dataset.n);
  else if(a==="up")moveSub(cur,b.dataset.id,+b.dataset.n,-1);
  else if(a==="down")moveSub(cur,b.dataset.id,+b.dataset.n,1);
  else if(a==="edit"){editId=editId===b.dataset.id?null:b.dataset.id;swapKey=null;render()}
  else if(a==="swap"){swapKey=swapKey===b.dataset.key?null:b.dataset.key;render();const el=document.getElementById("swin");if(el){el.focus();el.select()}}
  else if(a==="gh-connect")ghConnect();
  else if(a==="gh-sync")ghSync();
  else if(a==="gh-off")ghDisconnect();
  else if(a==="gh-dl")downloadProgress();
  else if(a==="bk-copy")copyBackup();
  else if(a==="bk-restore")restoreBackup();
  else if(a==="addset")addSet(cur,b.dataset.id,+b.dataset.n);
  else if(a==="prev"){cur=clamp(addDays(cur,-1));render()} else if(a==="next"){cur=clamp(addDays(cur,1));render()}
  else if(a==="gotoday"){cur=clamp(todayIso);render()}
  else if(a==="open"){cur=b.dataset.d;view="today";weekStart=null;location.hash="today";render();window.scrollTo(0,0)}
  else if(a==="wprev"){weekStart=addDays(weekStart,-7);render()} else if(a==="wnext"){weekStart=addDays(weekStart,7);render()}
  else if(a==="feel"){const dd=dayDoc(cur);const n=+b.dataset.n;dd.feel=dd.feel===n?0:n;dd.at=new Date().toISOString();write("days",cur,dd);render()}
  else if(a==="savem"){
    const m={};document.querySelectorAll("[data-m]").forEach(i=>{if(i.value!=="")m[i.dataset.m]=i.type==="number"?Number(i.value):i.value.trim()});
    S.metrics[cur]=m;m.at=new Date().toISOString();write("metrics",cur,m);render();
  }
});
document.addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.lg){setLog(cur,e.target.dataset.id,+e.target.dataset.j,+e.target.dataset.k,e.target.dataset.lg,e.target.value);return}
  if(e.target.id==="dnote"){
    const dd=dayDoc(cur);dd.note=e.target.value;dd.at=new Date().toISOString();
    const d=cur;clearTimeout(noteTimer);noteTimer=setTimeout(()=>write("days",d,S.days[d]),700);
  }
});
document.addEventListener("toggle",e=>{const k=e.target&&e.target.dataset&&e.target.dataset.k;if(k){if(e.target.open)OPEN.add(k);else OPEN.delete(k)}},true);
document.addEventListener("focusout",e=>{
  if(e.target.id!=="swin")return;
  const id=e.target.dataset.id,j=+e.target.dataset.n,v=e.target.value.trim(),item=itemsFor(cur).find(i=>i.id===id);
  swapKey=null;
  if(item&&v){const dd=dayDoc(cur);if(!dd.sw)dd.sw={};if(v===item.s[j][0])delete dd.sw[subKey(id,j)];else dd.sw[subKey(id,j)]=v;save(cur)}
  render();
});
document.addEventListener("keydown",e=>{if(e.target.id==="swin"&&e.key==="Enter")e.target.blur()});
document.addEventListener("change",e=>{if(e.target.id==="liftsel"){liftSel=e.target.value;render()}});
$("#tabs").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;view=b.dataset.v;if(view==="week")weekStart=monday(cur);location.hash=view;render();
});
function fromHash(){const h=location.hash.slice(1);if(["today","week","plan","progress"].includes(h)){view=h;if(h==="week")weekStart=monday(cur)}}
window.addEventListener("hashchange",()=>{fromHash();render()});

/* ---------- data ---------- */
function listen(coll,apply){
  let timer=setTimeout(()=>{if(mode==="loading"){mode="slow";setSync()}},10000);
  return db.collection(coll).onSnapshot(snap=>{
    clearTimeout(timer);
    snap.docs.forEach(doc=>apply(doc.id,doc.exists?JSON.parse(JSON.stringify(doc.data())):null));
    if(!snap.metadata.fromCache&&mode!=="local"){mode="ok"}
    setSync();render("soft");
  },err=>{clearTimeout(timer);mode="local";setSync()});
}
async function loadUpdates(){
  try{const r=await fetch("plan-updates.json",{cache:"no-store"});if(!r.ok)return;const j=await r.json();
    if(j.adjust&&typeof j.adjust==="object")S.adjust=j.adjust; if(j.coach&&j.coach.text)S.coach=j.coach; render("soft")}catch(e){}
}
function loadLocal(){
  DAYS.forEach(d=>{const v=localGet("days/"+d.d);if(v)S.days[d.d]=v;const m=localGet("metrics/"+d.d);if(m)S.metrics[d.d]=m});
  mode="local";setSync();render();
}
(async function init(){
  fromHash();render();
  try{ db=window.claude?await window.claude.use("db"):null }catch(e){db=null}
  if(!db){ghCfg();loadLocal();loadUpdates();if(GH.cfg)ghSync();
    document.addEventListener("visibilitychange",()=>{if(!document.hidden&&GH.cfg)ghSync()});return}
  listen("days",(id,v)=>{if(!v||inflight["days/"+id])return;const have=S.days[id];if(have&&have.at&&(!v.at||String(v.at)<String(have.at)))return;S.days[id]=Object.assign({},v,{t:v.t||{},note:v.note||"",feel:v.feel||0})});
  listen("metrics",(id,v)=>{if(v)S.metrics[id]=v});
  listen("adjust",(id,v)=>{if(v)S.adjust[id]=v; else delete S.adjust[id]});
  listen("coach",(id,v)=>{if(id==="note")S.coach=v});
})();
</script>
